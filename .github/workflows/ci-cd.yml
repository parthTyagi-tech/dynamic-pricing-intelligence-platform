name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number for branch verification'
        required: false
        default: ''
      base_ref:
        description: 'Target base branch (default: main)'
        required: false
        default: 'main'
  schedule:
    # Weekly audit run (Monday 06:00 UTC) with blocking security checks
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Backend CI: Linting, Type & Hermetic Unit/Integration Tests (SQLite)
  # =========================================================================
  backend-ci:
    name: Backend CI (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      FLASK_ENV: testing
      MOCK_SCRAPING: "true"
      VERCEL: "1"
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "ci-testing-secret-key-32-chars-minimum-safe!!"
      JWT_SECRET_KEY: "ci-testing-jwt-secret-key-32-chars-safe!!"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff (Blocking Syntax & Undefined Names)
        run: |
          ruff check --select E9,F63,F7,F82 .

      - name: Ruff Comprehensive Inspection (Report Only)
        run: |
          ruff check . --exit-zero

      - name: Run Hermetic Pytest Suite with Coverage
        run: |
          mkdir -p reports
          pytest -m "not live and not network" --tb=short --junitxml=reports/junit.xml -o junit_family=xunit1 --cov=app --cov-report=xml:reports/coverage.xml

      - name: Upload Test and Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/reports/
          retention-days: 7

  # =========================================================================
  # 2. Backend Postgres: Real PostgreSQL Service & Schema Upgrade Validation
  # =========================================================================
  backend-postgres:
    name: Backend DB Upgrade (PostgreSQL 15)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: klypup
          POSTGRES_PASSWORD: klypup_password
          POSTGRES_DB: klypup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      FLASK_ENV: testing
      MOCK_SCRAPING: "true"
      VERCEL: "1"
      DATABASE_URL: "postgresql+psycopg2://klypup:klypup_password@localhost:5432/klypup_test"
      SECRET_KEY: "ci-testing-secret-key-32-chars-minimum-safe!!"
      JWT_SECRET_KEY: "ci-testing-jwt-secret-key-32-chars-safe!!"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Alembic Migrations Against Fresh PostgreSQL
        run: |
          flask db upgrade

      - name: Verify PostgreSQL Database Schema & Model Compatibility
        run: |
          python -c "
          import sqlalchemy as sa
          from app import create_app
          from app.extensions import db
          app = create_app(start_worker=False)
          with app.app_context():
              inspector = sa.inspect(db.engine)
              tables = set(inspector.get_table_names())
              print('Tables created by migrations:', sorted(tables))
              assert 'products' in tables, 'Missing products table'
              assert 'pricing_recommendations' in tables, 'Missing pricing_recommendations table'
              print('Core migration schema verified successfully on PostgreSQL 15.')
          "

  # =========================================================================
  # 3. Frontend CI: TypeScript Linting & Vite Production Bundling
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint (TypeScript & React)
        run: npm run lint

      - name: Build Production SPA Bundle
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # =========================================================================
  # 4. Security Audit: Secret Detection & Dependency Vulnerability Auditing
  # =========================================================================
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Full Git History for Secret Scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - name: Set up Python 3.12 for pip-audit
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run pip-audit on Backend Runtime Dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - name: Set up Node 20 for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm audit in Frontend
        working-directory: frontend
        run: |
          npm audit --audit-level=high
        continue-on-error: ${{ github.event_name != 'schedule' }}

  # =========================================================================
  # 5. Docker Build Verification & Container Health Smoke Test
  # =========================================================================
  docker-verification:
    name: Docker Build & Smoke Test (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: klypup-backend:ci
            smoke_test: true
          - name: worker
            context: ./backend
            file: ./backend/Dockerfile.worker
            image: klypup-worker:ci
            smoke_test: false
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: klypup-frontend:ci
            smoke_test: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.file }}
          push: false
          load: true
          tags: ${{ matrix.target.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Health Smoke Test (Backend Only)
        if: matrix.target.smoke_test == true
        run: |
          docker run -d --name smoke_container \
            -p 5000:5000 \
            -e FLASK_ENV=testing \
            -e VERCEL=1 \
            -e DATABASE_URL=sqlite:///:memory: \
            -e SECRET_KEY="smoke-test-secret-32-chars-minimum-safe!!" \
            -e JWT_SECRET_KEY="smoke-test-jwt-secret-32-chars-safe!!" \
            ${{ matrix.target.image }}

          echo "Waiting for container health endpoint..."
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/health > /dev/null 2>&1; then
              echo "Smoke test PASSED: Container is healthy and responding."
              docker logs smoke_container
              docker stop smoke_container
              exit 0
            fi
            echo "Waiting for backend startup (attempt $i/15)..."
            sleep 2
          done

          echo "Smoke test FAILED: Container failed to respond on /health within 30s."
          docker logs smoke_container
          docker stop smoke_container
          exit 1

  # =========================================================================
  # 6. Gated Deployment (CD): Dispatched only when all quality gates pass on main
  # =========================================================================
  deploy:
    name: Production Deployment Dispatch
    needs: [backend-ci, backend-postgres, frontend-ci, security-audit, docker-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
    steps:
      - name: Trigger Coolify Deployment Webhook
        run: |
          if [ -n "$COOLIFY_WEBHOOK_URL" ]; then
            echo "Triggering automated Coolify redeployment webhook..."
            curl -fsS -X POST "$COOLIFY_WEBHOOK_URL"
            echo "Coolify redeployment successfully queued."
          else
            echo "COOLIFY_WEBHOOK_URL secret not configured. Skipping webhook dispatch."
          fi

      - name: Post-Deployment Health Verification
        run: |
          if [ -n "$API_HEALTH_URL" ]; then
            echo "Polling public API health endpoint: $API_HEALTH_URL..."
            curl -fsS --retry 10 --retry-delay 6 --max-time 10 "$API_HEALTH_URL"
            echo "Public API health check confirmed healthy."
          else
            echo "API_HEALTH_URL repository variable not configured. Skipping post-deploy check."
          fi

  # =========================================================================
  # 7. Self-Healing: Triggered via DeepSeek Harness when CI fails on a PR
  # =========================================================================
  auto-heal:
    name: DeepSeek Harness Self-Healing
    needs: [backend-ci, backend-postgres, frontend-ci]
    if: failure() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) && !contains(github.event.pull_request.title || '', '[skip auto-heal]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-heal-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Test Dependencies for Local Verification
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Download Backend Test Reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-test-reports
          path: backend/reports/

      - name: Execute DeepSeek & Groq Self-Healing Diagnosis & Local Verification
        id: self_heal
        env:
          PYTHONPATH: backend
          FLASK_ENV: testing
          MOCK_SCRAPING: "true"
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-testing-secret-key-32-chars-minimum-safe!!"
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-32-chars-safe!!"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_BACKUP: ${{ secrets.GROQ_API_KEY_BACKUP }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          python tools/deepseek_self_heal.py --no-push

      - name: Push Auto-Heal Fix to Remote PR Branch
        if: steps.self_heal.outputs.healed == 'true'
        env:
          HEAL_BOT_TOKEN: ${{ secrets.HEAL_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          HEAL_BOT_TOKEN_CONFIGURED: ${{ secrets.HEAL_BOT_TOKEN != '' }}
          GITHUB_BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          python tools/deepseek_self_heal.py --push-only

