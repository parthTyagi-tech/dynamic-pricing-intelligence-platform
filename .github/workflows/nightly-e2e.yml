name: Nightly Live Marketplace E2E

on:
  schedule:
    # Runs at 02:00 UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-marketplace-verification:
    name: Live Scraper & E2E Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          playwright install --with-deps chromium

      - name: Run Live Multi-Platform Extraction (Report Only)
        continue-on-error: true
        run: |
          mkdir -p reports/nightly
          python tools/test_live_multi_platform_extraction.py 2>&1 | tee reports/nightly/extraction.log

      - name: Run Playwright E2E Verification (Report Only)
        continue-on-error: true
        run: |
          python tools/playwright_e2e_verification.py 2>&1 | tee reports/nightly/playwright.log

      - name: Upload Nightly E2E Reports & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-e2e-artifacts
          path: |
            reports/nightly/
            screenshots/
          retention-days: 14
